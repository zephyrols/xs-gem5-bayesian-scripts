# ── Optimization (optional) ─────────────────────────────────
optimization:
  constants: [--some-fixed-flag]
  space:
    - { name: l1d_size,   type: pow2,   range: [4, 8] }
    - { name: l2_assoc,   type: int,    range: [4, 16] }
    - { name: prefetcher, type: choice, values: [none, stride, bop] }
    - { name: use_victim, type: bool }