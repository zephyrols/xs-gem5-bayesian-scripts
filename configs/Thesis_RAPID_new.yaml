# ── GEM5 Simulation Config ───────────────────────────────────

# 换 gem5 版本 / 仿真器时只改这里
gem5:
  home: /nfs/home/qiuzeyuan/repos/GEM5
  bin_home: /nfs/home/qiuzeyuan/repos/GEM5/test/optimize/bin
  # binary: gem5.Thesis.InstLens.909d12.fast
  # binary: gem5.Thesis.InstLens.a23cbce.fast
  # binary: gem5.Thesis.InstLens.260323.e7ef07.fast
  # binary: gem5.Thesis.InstLens.260325.8473d4.fast
  binary: gem5.Thesis.InstLens.260326.c1bff3.fast

env:
  - name: GCB_RESTORER
    value: ""
  - name: GCBV_REF_SO
    value: sources/riscv64-nemu-notama-tvalref-so
  - name: GEM5_DATA_PROC
    value: third_party/gem5_data_proc

# 调运行策略时只改这里
run:
  output_dir: output/RAPID/mySpec06-full
  resume: true
  checkpoint_weight: 0.8    # simpoint 累计权重阈值

# 扩缩容 / 换集群环境时只改这里
cluster:
  max_procs_per_node: 64
  shell_init:         # 每个远程 job 前执行的初始化命令
    - source ~/miniconda3/etc/profile.d/conda.sh
    - conda activate gem5py38
    - export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH
  servers:
    - node007.bosccluster.com
    - node008.bosccluster.com
    - node009.bosccluster.com
    - node020.bosccluster.com
    - node021.bosccluster.com
    - node022.bosccluster.com
    - node023.bosccluster.com
    - node024.bosccluster.com
    - node025.bosccluster.com
    - node026.bosccluster.com
    - node027.bosccluster.com
    - node028.bosccluster.com
    - node029.bosccluster.com
    - node033.bosccluster.com
    - node034.bosccluster.com
    - node035.bosccluster.com
    - node036.bosccluster.com
    - node037.bosccluster.com
    - node038.bosccluster.com
    - node039.bosccluster.com
    - node040.bosccluster.com

# 换 benchmark suite 时只改这里
workloads:
  preset: spec2006
  # only: [namd]
  # exclude: [sphinx3]

# 改微架构参数时只改这里
archs:
  defaults:
    script: configs/example/xiangshan.py
  configs:
    # ========== L2配置 ==========
    - name: L2/none
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --no-pf
    # ========== 单一预取器 ==========
    - name: L2/bop
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l2_dump_prefetch_request_trace
        - --l2-enable-bop
    - name: L2/adjacent
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l2_dump_prefetch_request_trace
        - --l2-enable-tencent-prefetcher
    - name: L2/cdp
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l2_dump_prefetch_request_trace
        - --l2-enable-cdp
    # ========== 2-组合 ==========
    - name: L2/bop_adjacent
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l2_dump_prefetch_request_trace
        - --l2-enable-bop
        - --l2-enable-tencent-prefetcher
    - name: L2/bop_cdp
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l2_dump_prefetch_request_trace
        - --l2-enable-bop
        - --l2-enable-cdp
    - name: L2/adjacent_cdp
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l2_dump_prefetch_request_trace
        - --l2-enable-tencent-prefetcher
        - --l2-enable-cdp
    # ========== 3-组合 ==========
    - name: L2/bop_adjacent_cdp
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l2_dump_prefetch_request_trace
        - --l2-enable-bop
        - --l2-enable-tencent-prefetcher
        - --l2-enable-cdp




    # ========== L1配置 ==========
    - name: L1/none
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --no-pf
    # ========== 单一预取器 ==========
    - name: L1/stream
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l1d_dump_prefetch_request_trace
        - --l1d-enable-stream
    - name: L1/stride
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l1d_dump_prefetch_request_trace
        - --l1d-enable-stride
    - name: L1/cplx
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l1d_dump_prefetch_request_trace
        - --l1d-enable-cplx
    # ========== 2-组合 (6种) ==========
    - name: L1/stream_stride
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l1d_dump_prefetch_request_trace
        - --l1d-enable-stream
        - --l1d-enable-stride
    - name: L1/stream_cplx
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l1d_dump_prefetch_request_trace
        - --l1d-enable-stream
        - --l1d-enable-cplx
    - name: L1/stride_cplx
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l1d_dump_prefetch_request_trace
        - --l1d-enable-stride
        - --l1d-enable-cplx
    # ========== 3-组合 ==========
    - name: L1/stream_stride_cplx
      script_file: configs/example/xiangshan.py
      params:
        - --bp-type=DecoupledBPUWithBTB
        - --kmh-align
        - --l1d_dump_prefetch_request_trace
        - --l1d-enable-stream
        - --l1d-enable-stride
        - --l1d-enable-cplx

    


